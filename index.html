        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@200;300;400;600;700;800&display=swap');
        
        body {
            font-family: 'Assistant', sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
        }

        /* --- Print Optimization Fixes --- */
        @media print {
            @page { 
                size: A4 portrait; /* Changed to portrait for better newsletter/table fitting */
                margin: 15mm 10mm; /* Increased top margin to prevent cutting */
            }

            body { 
                background-color: white; 
                -webkit-print-color-adjust: exact; 
                print-color-adjust: exact; 
                width: 100% !important;
                zoom: 1; 
                font-size: 11px; 
            }

            nav, .no-print { display: none !important; }
            
            main { 
                padding: 0 !important; 
                margin: 0 !important; 
                max-width: 100% !important; 
                width: 100% !important; 
                box-shadow: none !important; 
            }
            .main-container {
                box-shadow: none !important;
                margin: 0 !important;
                padding: 0 !important;
                max-width: 100% !important;
            }

            /* Force Grid Layout */
            .print-grid-force {
                display: grid !important;
                grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
                gap: 0.8rem !important; 
            }

            /* Header Layout */
            .print-flex-row-force {
                display: flex !important;
                flex-direction: row !important;
                align-items: center !important;
                padding-bottom: 0.5rem !important;
                margin-bottom: 0.5rem !important;
            }

            /* Compact Spacing */
            .p-5 { padding: 0.6rem !important; }
            .space-y-6 > :not([hidden]) ~ :not([hidden]) { --tw-space-y-reverse: 0; margin-top: 0.5rem !important; margin-bottom: 0 !important; }
            
            /* Text Alignment */
            .print-text-start { text-align: right !important; }
            html[dir="ltr"] .print-text-start { text-align: left !important; }

            /* Font Sizes Fixes */
            .text-sm { font-size: 10pt !important; line-height: 1.25 !important; }
            .text-xs { font-size: 9pt !important; }
            
            /* Ensure logo visibility */
            .print-visible-force { display: block !important; }
            .print-flex-force { display: flex !important; }

            .shadow-2xl, .shadow-sm, .shadow-md { box-shadow: none !important; border: 1px solid #cbd5e1; }
            .bg-slate-900 { color: white !important; }
            
            /* Page Break Utilities */
            .break-inside-avoid { break-inside: avoid; page-break-inside: avoid; }
            tr { break-inside: avoid; page-break-inside: avoid; } /* Ensure table rows don't split */
            
            .tab-content:not(.active-print) { display: none; }
        }
        
        /* Custom Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
    </style>
</head>

                    {/* Comparison Table */}
                    <div className="bg-white rounded-3xl border border-slate-200 shadow-lg overflow-hidden mt-16 break-inside-avoid">

                                <Icon name="Layers" size={28} className="text-blue-400" />

                            <table className={`w-full border-collapse ${isRtl ? 'text-right' : 'text-left'}`}>

                                        </tr>

                        <p className="text-slate-400 text-lg mb-8 max-w-2xl mx-auto">{t.cta.subtitle}</p>

                            {t.cta.button}
                        </button>
                    </div>
                </div>
            );
        };

        const OnePager = ({ lang }) => {
            const t = siteContent[lang].onepager;
            
            return (
                <div className="bg-white text-slate-800 p-8 shadow-2xl max-w-6xl mx-auto rounded-lg relative my-8 main-container" dir={lang === 'he' ? 'rtl' : 'ltr'}>

                            <SafeImage src="onebtn_logo.png" className="w-16 h-16 object-contain rounded-lg border-2 border-slate-200 bg-white" fallback={<div className="w-16 h-16 bg-slate-900 rounded-lg flex items-center justify-center text-white font-black text-xs text-center">LOGO<br/>ONEBTN</div>} />
                            <div>
                                <h1 className="text-4xl font-extrabold text-slate-900 leading-none">ONEBTN</h1>
                                <p className="text-sm text-slate-500 font-bold tracking-widest mt-1">ONE SYSTEM. INFINITE CONTROL.</p>
                            </div>
                        </div>
                        <div className="text-center flex-1 px-4 hidden md:block print-text-start" style={{ display: 'block' }}>

                            <p className="text-lg text-slate-600 font-semibold">{t.header.subTagline}</p>
                        </div>
                        <SafeImage src="oneflow_logo.png" className="hidden md:block w-48 h-auto object-contain print-visible-force" fallback={<div className="hidden md:flex w-24 h-24 bg-blue-100 rounded-full items-center justify-center text-blue-600 font-bold text-sm border border-blue-300 print-flex-force">ONEFLOW<br/>360</div>} />
                    </div>

                    <div className="bg-slate-50 p-5 rounded-lg border-l-4 border-blue-500 mb-4 text-center md:text-start shadow-sm break-inside-avoid print-text-start">

                    </div>

                    <div className="text-center mb-8 px-4 break-inside-avoid">

                        </h3>
                    </div>

                            alt="ONEFLOW 360 Ecosystem Infographic"
                            className="w-full h-auto rounded-xl border border-slate-200 shadow-sm"
                            fallback={<div className="w-full h-64 bg-slate-100 rounded-xl flex items-center justify-center text-slate-500">Infographic Placeholder</div>}
                        />
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8 print-grid-force">
                        <div className="space-y-6">
                            <div className="bg-red-50 p-5 rounded-xl border border-red-100 break-inside-avoid">
                                <div className="flex items-center gap-2 mb-3 text-red-700 font-bold"><Icon name="ShieldCheck" /> {t.problem.title}</div>
                                <ul className="space-y-2 text-sm text-slate-700">
                                    {t.problem.points.map((p, i) => <li key={i} className="flex gap-2"><span>•</span>{p}</li>)}
                                </ul>
                            </div>
                            <div className="bg-emerald-50 p-5 rounded-xl border border-emerald-100 break-inside-avoid">
                                <div className="flex items-center gap-2 mb-3 text-emerald-700 font-bold"><Icon name="Layers" /> {t.solution.title}</div>
                                <p className="text-xs font-bold text-emerald-600 mb-2 uppercase">{t.solution.subtitle}</p>
                                <ul className="space-y-2 text-sm text-slate-700">
                                    {t.solution.points.map((p, i) => <li key={i} className="flex gap-2"><Icon name="CheckCircle" className="text-emerald-600" size={14} />{p}</li>)}
                                </ul>
                            </div>
                            <div className="bg-indigo-50 p-5 rounded-xl border border-indigo-100 break-inside-avoid">
                                <div className="flex items-center gap-2 mb-3 text-indigo-800 font-bold"><Icon name="Zap" /> {t.innovation.title}</div>
                                <ul className="space-y-3 text-sm text-slate-700">
                                    {t.innovation.points.map((p, i) => (
                                        <li key={i} className="flex gap-2 items-start">
                                            <div className="mt-1 text-indigo-600 shrink-0"><Icon name={p.icon} size={16} /></div>
                                            <span>{p.text}</span>
                                        </li>
                                    ))}
                                </ul>
                            </div>
                             <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm break-inside-avoid">
                                <div className="flex items-center gap-2 mb-3 text-orange-600 font-bold"><Icon name="LayoutGrid" /> {t.competition.title}</div>
                                <div className="text-xs font-semibold text-slate-500 mb-2">{t.competition.competitors}</div>
                                <ul className="text-sm space-y-2">
                                    {t.competition.differentiators.map((d, i) => <li key={i} className="flex gap-2"><Icon name="CheckCircle" className="text-orange-500" size={14} />{d}</li>)}
                                </ul>
                            </div>
                        </div>

                        <div className="space-y-6">
                             <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm break-inside-avoid">
                                <div className="flex items-center gap-2 mb-3 text-blue-700 font-bold"><Icon name="Target" /> {t.market.title}</div>
                                <div className="text-center">
                                    <div className="text-2xl font-black text-slate-800">{t.market.tam}</div>
                                    <div className="text-xs text-slate-500">{t.market.tamDesc}</div>
                                    <div className="mt-2 text-xl font-bold text-emerald-600">{t.market.growth}</div>
                                </div>
                            </div>
                            <div className="bg-blue-50 p-5 rounded-xl border border-blue-200 break-inside-avoid">
                                <div className="flex items-center gap-2 mb-3 text-blue-800 font-bold"><Icon name="TrendingUp" /> {t.traction.title}</div>
                                <div className="text-xs font-semibold text-blue-600 mb-2 uppercase">{t.traction.subtitle}</div>
                                <ul className="space-y-2 text-sm text-slate-700">
                                    {t.traction.points.map((p, i) => <li key={i} className="flex gap-2"><span>•</span>{p}</li>)}
                                </ul>
                            </div>
                            <div className="bg-slate-50 p-5 rounded-xl border border-slate-200 break-inside-avoid">
                                <div className="flex items-center gap-2 mb-3 text-slate-700 font-bold"><Icon name="DollarSign" /> {t.businessModel.title}</div>
                                <div className="space-y-2 text-sm">
                                    <div className="flex justify-between border-b pb-1"><span>Setup</span><span>{t.businessModel.setup}</span></div>
                                    <div className="flex justify-between border-b pb-1"><span>SaaS</span><span>{t.businessModel.saas}</span></div>
                                    <div className="text-xs text-blue-600 mt-2 font-bold">{t.businessModel.highlight}</div>
                                </div>
                            </div>
                            <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm break-inside-avoid">
                                <div className="flex items-center gap-2 mb-3 text-indigo-700 font-bold"><Icon name="BarChart3" /> {t.financials.title}</div>
                                <SimpleLineChart data={financialData} />
                                <div className="text-center bg-indigo-50 p-2 rounded border border-indigo-100 text-indigo-900 font-bold text-sm mt-2">{t.financials.subtitle}</div>
                            </div>
                             <div className="bg-purple-50 p-5 rounded-xl border border-purple-200 break-inside-avoid">
                                <div className="flex items-center gap-2 mb-3 text-purple-800 font-bold"><Icon name="Rocket" /> {t.scale.title}</div>
                                <ul className="space-y-2 text-sm text-slate-700">
                                    {t.scale.points.map((p, i) => (
                                        <li key={i} className="flex gap-2 items-start">
                                            <div className="mt-1 text-purple-600 shrink-0"><Icon name={p.icon} size={14} /></div>
                                            <span className="leading-tight">{p.text}</span>
                                        </li>
                                    ))}
                                </ul>
                            </div>
                        </div>

                        <div className="space-y-6">
                            <div className="bg-slate-50 p-5 rounded-xl border border-slate-200 break-inside-avoid">
                                <div className="flex items-center gap-2 mb-3 text-slate-700 font-bold"><Icon name="Users" /> {t.team.title}</div>
                                <div className="space-y-4">
                                    {t.team.members.map((member, i) => (
                                        <div key={i} className="flex gap-4 items-start">
                                            <SafeImage src={member.img} className="w-16 h-16 object-cover rounded-full border-2 border-white shadow-md shrink-0" fallback={<div className="w-16 h-16 bg-white border rounded-full flex items-center justify-center font-bold text-slate-500 text-lg shadow-sm shrink-0">{member.name.charAt(0)}</div>} />
                                            <div>
                                                <div className="font-bold text-base text-slate-900">{member.name}</div>
                                                <div className="text-blue-600 font-semibold text-xs mb-1">{member.role}</div>
                                                <div className="text-sm text-slate-500 leading-tight team-desc-print">{member.desc}</div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="bg-orange-50 p-5 rounded-xl border border-orange-200 break-inside-avoid">
                                <div className="flex items-center gap-2 mb-3 text-orange-800 font-bold"><Icon name="Briefcase" /> {t.partners.title}</div>
                                <ul className="space-y-2 text-sm text-slate-700">
                                    {t.partners.points.map((p, i) => <li key={i} className="flex gap-2 items-start"><Icon name="Handshake" className="text-orange-600 shrink-0" size={14} /><span className="leading-tight">{p}</span></li>)}
                                </ul>
                            </div>

                            <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm break-inside-avoid">
                                <div className="flex items-center gap-2 mb-3 text-purple-700 font-bold"><Icon name="Map" /> {t.roadmap.title}</div>
                                <div className="space-y-3 relative">
                                    <div className="absolute top-2 bottom-2 w-0.5 bg-slate-100" style={{ [lang === 'he' ? 'right' : 'left']: '19px' }}></div>
                                    {t.roadmap.steps.map((step, i) => (
                                        <div key={i} className="flex gap-3 relative z-10 items-center">
                                            <div className="bg-purple-100 text-purple-700 text-[10px] font-bold px-2 py-1 rounded-full border border-purple-200 w-12 text-center shrink-0">{step.year}</div>
                                            <div className="text-xs text-slate-600 leading-tight bg-slate-50 p-2 rounded w-full border border-slate-100">{step.text}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="bg-gradient-to-br from-blue-700 to-indigo-900 p-8 rounded-xl text-white shadow-xl relative overflow-hidden break-inside-avoid mt-8">
                        <div className="absolute top-0 right-0 p-4 opacity-10"><Icon name="Star" size={120} /></div>
                        <div className="relative z-10 flex flex-col md:flex-row justify-between items-center gap-6 print-flex-row-force">
                            <div>
                                <h3 className="text-2xl font-bold mb-2 opacity-90">{t.ask.title}</h3>
                                <div className="text-5xl font-black mb-2 text-yellow-300 tracking-tight">{t.ask.amount}</div>
                                <div className="text-lg opacity-90 font-light">{t.ask.use}</div>
                            </div>
                            <div className="bg-white/10 p-4 rounded-lg backdrop-blur-sm text-sm border border-white/20 min-w-[250px]">
                                <div className="font-bold text-white mb-2 uppercase tracking-wider text-xs opacity-70">Contact Details</div>
                                <div className="font-mono text-base">{t.ask.contact}</div>
                            </div>
                        </div>
                    </div>

                    <div className="mt-8 pt-4 border-t border-slate-200 text-[10px] text-slate-500 text-justify leading-tight whitespace-pre-line break-inside-avoid disclaimer-print">
                        {t.disclaimer}
                    </div>

                    <div className="text-center mt-8 text-slate-400 text-xs">
                        &copy; 2026 ONEBTN. All rights reserved. Confidential.
                    </div>
                </div>
            );
        };

        const MainApp = () => {
            const [lang, setLang] = useState('he');
            const [activeTab, setActiveTab] = useState('newsletter'); // Setting newsletter as default to show it off
            const t = siteContent[lang]; 
            const isRtl = lang === 'he';

            useEffect(() => {
                if(activeTab === 'onepager') {
                    document.body.classList.add('printing-onepager');
                } else {
                    document.body.classList.remove('printing-onepager');
                }
            }, [activeTab]);

            return (
                <div dir={isRtl ? 'rtl' : 'ltr'}>
                     <ErrorBoundary>
                        <nav className="bg-slate-900 text-white p-3 shadow-lg sticky top-0 z-50 no-print">
                            <div className="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
                                <div className="flex items-center gap-4 w-full md:w-auto overflow-x-auto pb-2 md:pb-0">
                                    <div className="font-black text-lg tracking-tighter shrink-0">ONEBTN</div>
                                    <div className="h-5 w-px bg-slate-700 mx-1 hidden md:block"></div>
                                    <div className="flex gap-2 min-w-max">
                                        <button onClick={() => setActiveTab('onepager')} className={`px-3 py-1.5 rounded-full text-xs font-medium transition-all whitespace-nowrap ${activeTab === 'onepager' ? 'bg-blue-600 text-white' : 'hover:bg-slate-800 text-slate-300'}`}>{t.nav.onepager}</button>
                                        <button onClick={() => setActiveTab('newsletter')} className={`px-3 py-1.5 rounded-full text-xs font-bold transition-all flex items-center gap-1 whitespace-nowrap shadow-md ${activeTab === 'newsletter' ? 'bg-gradient-to-r from-purple-600 to-blue-600 text-white' : 'bg-slate-800 text-purple-300 hover:bg-slate-700'}`}><Icon name="Rocket" size={12}/>{t.nav.newsletter}</button>
                                        <div className="h-5 w-px bg-slate-700 mx-1"></div>
                                        <button onClick={() => setActiveTab('scripts')} className={`px-3 py-1.5 rounded-full text-xs font-medium transition-all whitespace-nowrap ${activeTab === 'scripts' ? 'bg-blue-600 text-white' : 'hover:bg-slate-800 text-slate-300'}`}>{t.nav.scripts}</button>
                                        <button onClick={() => setActiveTab('meeting')} className={`px-3 py-1.5 rounded-full text-xs font-medium transition-all flex items-center gap-1 whitespace-nowrap ${activeTab === 'meeting' ? 'bg-amber-500 text-white' : 'hover:bg-slate-800 text-amber-400'}`}><Icon name="Coffee" size={12}/>{t.nav.meeting}</button>
                                        <button onClick={() => setActiveTab('roadmap')} className={`px-3 py-1.5 rounded-full text-xs font-medium transition-all flex items-center gap-1 whitespace-nowrap ${activeTab === 'roadmap' ? 'bg-emerald-600 text-white' : 'hover:bg-slate-800 text-emerald-400'}`}><Icon name="Target" size={12}/>{t.nav.roadmap}</button>
                                    </div>
                                </div>
                                <button onClick={() => setLang(l => l === 'he' ? 'en' : 'he')} className="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded text-xs border border-slate-700 shrink-0 self-end md:self-auto">
                                    <Icon name="Globe" size={14} /> <span>{lang === 'he' ? 'English' : 'עברית'}</span>
                                </button>
                            </div>
                        </nav>

                        <main className="max-w-6xl mx-auto p-4 md:p-6">
                            <div className={activeTab === 'newsletter' ? 'block' : 'hidden tab-content'}>
                                <NewsletterTab lang={lang} />
                            </div>

                            <div className={activeTab === 'onepager' ? 'block active-print' : 'hidden tab-content'}>
                                <OnePager lang={lang} />
                            </div>

                            <div className={activeTab === 'scripts' ? 'block max-w-3xl mx-auto tab-content' : 'hidden tab-content'}>
                                <div className="bg-blue-50 border border-blue-200 p-4 rounded-lg mb-6 text-blue-900 text-sm flex gap-3 items-center"><Icon name="MessageSquare" size={18} className="text-blue-600" /> {t.scripts.intro}</div>
                                <ScriptCard title={t.scripts.types.email_lior} subject={t.scripts.content.email_lior.subject} body={t.scripts.content.email_lior.body} />
                                <ScriptCard title={t.scripts.types.email_short} subject={t.scripts.content.email_short.subject} body={t.scripts.content.email_short.body} />
                                <ScriptCard title={t.scripts.types.email_story} subject={t.scripts.content.email_story.subject} body={t.scripts.content.email_story.body} />
                                <ScriptCard title={t.scripts.types.linkedin} body={t.scripts.content.linkedin.body} />
                                <ScriptCard title={t.scripts.types.pitch} body={t.scripts.content.pitch.body} />
                            </div>

                            <div className={activeTab === 'meeting' ? 'block max-w-3xl mx-auto tab-content' : 'hidden tab-content'}>
                                <div className="bg-amber-50 border border-amber-200 p-4 rounded-lg mb-6 text-amber-900 text-sm flex gap-3 items-center"><Icon name="Coffee" size={24} className="text-amber-600" /><div><h2 className="font-bold text-lg">{t.meeting.title}</h2><p className="opacity-80">{t.meeting.subtitle}</p></div></div>
                                {t.meeting.sections.map((s, i) => <MeetingCard key={i} section={s} />)}
                            </div>

                            <div className={activeTab === 'roadmap' ? 'block max-w-3xl mx-auto tab-content' : 'hidden tab-content'}>
                                <div className="bg-emerald-50 border border-emerald-200 p-4 rounded-lg mb-6 text-emerald-900 text-sm flex gap-3 items-center"><Icon name="Target" size={24} className="text-emerald-600" /><div><h2 className="font-bold text-lg">{t.fundraising.intro}</h2><p className="opacity-80">תוכנית עבודה לגיוס</p></div></div>
                                {t.fundraising.steps.map((s, i) => <RoadmapCard key={i} step={s} />)}
                            </div>
                        </main>
                    </ErrorBoundary>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<MainApp />);
    </script>
</body>
</html>
